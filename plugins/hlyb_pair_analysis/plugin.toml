[plugin]
id = "embl.hlyb_pair_analysis"
name = "HlyB/D staged pair analysis"
version = "1.0.0"
author = "EMBL Imaging Centre"
description = "Model-independent short-range population analysis on inferred HlyB/D label sites."

[menu]
path = "Plugins > HlyB/D"
entry = "Staged pair analysis..."
keywords = [
    "hlyb",
    "hlyd",
    "dimer",
    "short range",
    "surface null",
    "conditional randomization",
    "e. coli",
    "ecoli",
    "pooled roi",
]

[run]
module = "main"
callable = "run"

[requires]
mfv_api = ">=1.0,<2.0"
app = ">=0.4.2"
python = ["numpy", "scipy"]
